# Runs CarePurse against the VTpass SANDBOX, on demand (Actions tab → "VTpass sandbox" → Run workflow).
#   provider: our VTpass provider alone (verify meter, buy electricity, airtime, data). No Stellar.
#   full:     also the whole flow: Mhasibu → purse contract → x402 on Stellar testnet → gateway → VTpass
#             sandbox. Two jobs run side by side: "vtpass" (airtime and data straight from the provider)
#             and "x402" (a ₦500 electricity top-up through the purse). They use different sandbox
#             destinations (phone vs meter), so neither waits for VTpass's duplicate guard because of
#             the other. Spends about 0.35 testnet USDC from the purse. Needs AGENT_SECRET_KEY too.
# Repository secrets (Settings → Secrets and variables → Actions):
#   VTPASS_API_KEY, VTPASS_SECRET_KEY, VTPASS_PUBLIC_KEY   (sandbox keys)
#   AGENT_SECRET_KEY                                        (only for "full"; Mhasibu's testnet wallet)
name: VTpass sandbox

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "provider = VTpass only; full = Mhasibu + contract + x402 + VTpass"
        type: choice
        options: [provider, full]
        default: provider
      checks:
        description: "provider mode: which purchases (VTpass refuses repeats to the same number within minutes)"
        type: string
        default: electricity,airtime,data

permissions:
  contents: read

env:
  STELLAR_NETWORK: stellar:testnet
  UTILITY_PROVIDER: vtpass
  VTPASS_BASE_URL: https://sandbox.vtpass.com/api
  VTPASS_CONTACT_PHONE: "08011111111"
  VTPASS_API_KEY: ${{ secrets.VTPASS_API_KEY }}
  VTPASS_SECRET_KEY: ${{ secrets.VTPASS_SECRET_KEY }}
  VTPASS_PUBLIC_KEY: ${{ secrets.VTPASS_PUBLIC_KEY }}

jobs:
  vtpass:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check the secrets are set (names only)
        run: |
          for v in VTPASS_API_KEY VTPASS_SECRET_KEY VTPASS_PUBLIC_KEY; do
            if [ -z "${!v}" ]; then echo "::error::Repository secret $v is missing"; exit 1; fi
          done

      - name: Gateway tests (offline)
        working-directory: services/gateway
        run: npm ci && npm test

      # In full mode the x402 job buys the electricity, so this job buys airtime and data only.
      # Those two share the sandbox's one test phone, so data may wait out the 5-minute guard.
      - name: VTpass sandbox, provider only
        working-directory: services/gateway
        env:
          CHECKS: ${{ inputs.mode == 'full' && 'airtime,data' || inputs.checks }}
        run: npm run vtpass-check

  x402:
    if: inputs.mode == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Full flow over x402 (electricity)
        env:
          AGENT_SECRET_KEY: ${{ secrets.AGENT_SECRET_KEY }}
          GATEWAY_RECIPIENT: GDFFLJ7SQVYJDH7RB7JYIBRLHRHOP7IV4XILUMHS5WPOJ5DAJCTO7CAA
          PURSE_CONTRACT_ID: CCJMZQ47JXY3CT6OKWGD4AUQFSRDHRMPOBHOGCCXXVKVFG5RTLQ3B3XC
          GATEWAY_URL: http://localhost:4021
        run: |
          if [ -z "$AGENT_SECRET_KEY" ]; then echo "::error::Repository secret AGENT_SECRET_KEY is missing"; exit 1; fi
          (cd services/gateway && npm ci --silent && (npm start > ../../gateway.log 2>&1 &))
          for i in $(seq 1 30); do curl -sf localhost:4021/health >/dev/null && break; sleep 1; done
          cd packages/mhasibu && npm ci
          # Mama asks for light and picks 1) ₦500: purse contract → x402 on Stellar testnet → VTpass.
          start=$(date +%s)
          npm run chat -- "Abeg, light don almost finish" "1" | tee ../../chat.log
          echo "Top-up took $(( $(date +%s) - start )) s (including the chat starting up)"
          paid=$(grep -c "paid on Stellar testnet" ../../chat.log || true)
          stuck=$(grep -c "refund failed" ../../chat.log || true)
          grep -i "provider refused" ../../gateway.log || true
          echo "Settled: $paid · stuck: $stuck"
          [ "$stuck" -eq 0 ] && [ "$paid" -eq 1 ]
