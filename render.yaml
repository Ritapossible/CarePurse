# Render Blueprint for CarePurse (Stellar TESTNET, VTpass SANDBOX).
# Render dashboard → New → Blueprint → pick this repo. Values marked sync: false are typed into
# the dashboard (secrets never go in this file). See DEPLOY.md.
services:
  # The x402 seller: prices top-ups, answers 402, fulfils through the utility provider.
  - type: web
    name: carepurse-gateway
    runtime: node
    plan: free
    rootDir: services/gateway
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - { key: NODE_VERSION, value: "22" }
      - { key: STELLAR_NETWORK, value: "stellar:testnet" }
      - { key: STELLAR_RPC_URL, value: https://soroban-testnet.stellar.org }
      - { key: STELLAR_HORIZON_URL, value: https://horizon-testnet.stellar.org }
      - { key: STELLAR_EXPLORER_URL, value: https://stellar.expert/explorer/testnet }
      - { key: USDC_CONTRACT_ID, value: CBIELTK6YBZJU5UP2WWQEUCYKLPU6AUNZ2BQ4WWFEIE3USCIHMXQDAMA }
      - { key: USDC_ISSUER, value: GBBD47IF6LWK7P7MDEVSCWR7DPUWV3NY3DTQEVFL4NAT4AQH3ZLLFLA5 }
      - { key: USDC_DECIMALS, value: "7" }
      - { key: FACILITATOR, value: backup }
      - { key: FACILITATOR_BACKUP_URL, value: https://x402.org/facilitator }
      - { key: NGN_PER_USDC, value: "1470" }
      - { key: SERVICE_FEE_BPS, value: "300" }        # 3% service fee; same on both services
      - { key: ORDER_TTL_MINUTES, value: "10" }
      - { key: UTILITY_PROVIDER, value: vtpass }
      - { key: VTPASS_BASE_URL, value: https://sandbox.vtpass.com/api }
      - { key: VTPASS_CONTACT_PHONE, value: "08011111111" }
      - { key: GATEWAY_RECIPIENT, sync: false }      # public address of the gateway wallet
      - { key: GATEWAY_URL, sync: false }            # this service's own https URL
      - { key: VTPASS_API_KEY, sync: false }
      - { key: VTPASS_SECRET_KEY, sync: false }
      - { key: VTPASS_PUBLIC_KEY, sync: false }
      - { key: DATABASE_URL, sync: false }           # Neon Postgres: orders and tokens survive restarts
      - { key: GATEWAY_API_KEY, generateValue: true } # only Mhasibu may read orders (meter, phone, tokens)
      - { key: DATA_ENCRYPTION_KEY, generateValue: true } # orders sealed with AES-256-GCM before Postgres

  # Mhasibu: holds the agent wallet, asks the purse contract, pays the gateway over x402.
  - type: web
    name: carepurse-mhasibu
    runtime: node
    plan: free
    rootDir: packages/mhasibu
    buildCommand: npm ci
    startCommand: npm run serve
    healthCheckPath: /v1/status
    envVars:
      - { key: NODE_VERSION, value: "22" }
      - { key: STELLAR_NETWORK, value: "stellar:testnet" }
      - { key: STELLAR_RPC_URL, value: https://soroban-testnet.stellar.org }
      - { key: STELLAR_HORIZON_URL, value: https://horizon-testnet.stellar.org }
      - { key: STELLAR_EXPLORER_URL, value: https://stellar.expert/explorer/testnet }
      - { key: USDC_CONTRACT_ID, value: CBIELTK6YBZJU5UP2WWQEUCYKLPU6AUNZ2BQ4WWFEIE3USCIHMXQDAMA }
      - { key: USDC_ISSUER, value: GBBD47IF6LWK7P7MDEVSCWR7DPUWV3NY3DTQEVFL4NAT4AQH3ZLLFLA5 }
      - { key: USDC_DECIMALS, value: "7" }
      - { key: NGN_PER_USDC, value: "1470" }
      - { key: SERVICE_FEE_BPS, value: "300" }        # 3% service fee; same on both services
      - { key: DEMO_MODE, value: "1" }
      - { key: LLM_API, value: openai }               # NEAR AI Cloud speaks the OpenAI-style chat API
      - { key: LLM_BASE_URL, value: https://cloud-api.near.ai/v1 }
      - { key: LLM_MODEL, value: deepseek-ai/DeepSeek-V4.1-Flash-1017 } # NEAR "verifiable": runs in an attested TEE (Mhasibu checks at start)
      - { key: PURSE_CONTRACT_ID, value: CCJMZQ47JXY3CT6OKWGD4AUQFSRDHRMPOBHOGCCXXVKVFG5RTLQ3B3XC }
      - { key: PURSE_WASM_HASH, value: 5fc9ac612be083a498a2b2413eb580f815448a793c7f7322491b7e0b0f8ec282 } # purse code for sign-up (npm run install-wasm)
      - { key: TREASURY_SECRET, sync: false }        # testnet wallet for "Get test USDC"
      - { key: SHOW_MAMA_CODE, value: "0" }          # set "1" only for a demo without SMS (TERMII_API_KEY): the code is then shown on screen
      - { key: GATEWAY_URL, sync: false }            # the gateway's https URL
      - { key: GATEWAY_RECIPIENT, sync: false }      # the gateway wallet's public address
      - { key: AGENT_SECRET_KEY, sync: false }       # Mhasibu's testnet wallet secret
      - { key: LLM_API_KEY, sync: false }            # NEAR AI Cloud key; empty = keyword parser
      - { key: MHASIBU_API_KEY, generateValue: true } # Render makes a random key; the web app reads it below
      - { key: DATABASE_URL, sync: false }           # same Neon database: purses, purchases, tokens, chat
      - { key: DATA_ENCRYPTION_KEY, generateValue: true } # purses and chat sealed with AES-256-GCM before Postgres
      - key: GATEWAY_API_KEY                          # the gateway's key, to create and look up orders
        fromService: { type: web, name: carepurse-gateway, envVarKey: GATEWAY_API_KEY }

  # Mama's chat and the judges' demo view.
  - type: web
    name: carepurse-web
    runtime: node
    plan: free
    rootDir: apps/web
    buildCommand: npm ci && npm run build
    startCommand: npm start
    envVars:
      - { key: NODE_VERSION, value: "22" }
      - { key: MHASIBU_URL, sync: false }             # Mhasibu's https URL (used on the server side only)
      - key: MHASIBU_API_KEY                          # the same key, never sent to browsers
        fromService: { type: web, name: carepurse-mhasibu, envVarKey: MHASIBU_API_KEY }
      - { key: WEB_ACCESS_CODE, sync: false }         # REQUIRED: links must end with ?code=<this>; without it the chat is closed
